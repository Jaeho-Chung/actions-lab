name: service-lab
on: [push, workflow_dispatch]
jobs:
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - name: Create table
        env:
          PGPASSWORD: secret
        run: |
          psql -h localhost -U postgres -c "CREATE TABLE t(id int);"
          psql -h localhost -U postgres -c "INSERT INTO t SELECT generate_series(1,100);"
          psql -h localhost -U postgres -c "SELECT count(*) FROM t;"
